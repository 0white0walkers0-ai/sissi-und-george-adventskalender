*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:24px 14px;background:radial-gradient(ellipse at top,#25483a,#091d17 80%);color:#e9ce94;font:16px Georgia,serif}main{max-width:540px;margin:20px auto;padding:24px;border:1px solid #a98b50;border-radius:18px;background:#102c22;box-shadow:0 12px 50px #0006;text-align:center}h1{font-size:clamp(25px,6vw,38px);margin:12px 0}p{line-height:1.5}button,select{font:inherit;color:#e9ce94;background:#183b2e;border:1px solid #a98b50;border-radius:9px;padding:12px;margin:4px;cursor:pointer}button:disabled,select:disabled{opacity:.4;cursor:default}button.primary{background:#e9ce94;color:#102c22}a{color:#e9ce94}hr{border:0;border-top:1px solid #806b42;margin:20px 0}.track{display:flex;align-items:center;gap:16px;text-align:left;min-height:100px}.art{width:90px;height:90px;object-fit:cover;border-radius:8px}.track h2{margin:0 0 6px;font-size:23px}.track p{margin:0;color:#c8b58b}.controls{display:flex;justify-content:center;flex-wrap:wrap;align-items:center}.round{border-radius:50%;width:58px;height:58px;font-size:22px}input[type=range]{width:100%;accent-color:#d6b36a}.times{display:flex;justify-content:space-between;font-size:13px}#status{font:14px system-ui;overflow-wrap:anywhere;color:#d9c9a7}.ornament{letter-spacing:4px;color:#d6b36a}.small{font-size:13px}select{max-width:100%;width:100%}
</style><main><div class="ornament">❦ ─── ♥ ─── ❦</div><h1>Unsere 24 Melodien</h1><p><i>Musik, die unsere Herzen verbindet.</i></p><hr><div class="track"><img id="cover" class="art" alt="Albumcover" hidden><div><h2 id="title">Unsere Musik</h2><p id="artist">Wähle einen Song</p></div></div><input id="seek" type="range" min="0" max="1" value="0" aria-label="Wiedergabeposition" disabled><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="prev" disabled aria-label="Vorheriger Song">◀◀</button><button id="toggle" class="primary round" disabled aria-label="Play oder Pause">▶</button><button id="next" disabled aria-label="Nächster Song">▶▶</button></div><label class="small" for="volume">Lautstärke (geräteabhängig)</label><input id="volume" type="range" min="0" max="100" value="60" disabled><hr><button id="one" disabled>All of Me – John Legend</button><button id="two" disabled>Perfect – Ed Sheeran</button><button id="pause" disabled>Pause</button><hr><p id="status" role="status">Nicht verbunden.</p><button id="login" class="primary">Mit Spotify anmelden</button><button id="connect" disabled>Player aktivieren</button><button id="logout">Abmelden</button><p class="small"><a href="https://open.spotify.com/">Spotify öffnen</a> · <a href="./">Zum Adventskalender</a></p><div class="ornament">❦ ───────── ❦</div></main><script>
const client_id="768a1408072e47fe80e09192b2ce6cfc",redirect_uri=location.origin+"/sissi-und-george-adventskalender/spotify-test.html",key="sg_spotify_test",q=id=>document.getElementById(id),say=s=>q("status").textContent=s;
let token=null,player=null,device=null,sdk=false,activated=false,refreshing=null;
const b64=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function random(){return b64(crypto.getRandomValues(new Uint8Array(48)))}
async function exchange(params){const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id,...params})});if(!r.ok)throw Error("Spotify Token: HTTP "+r.status);const t=await r.json();token={...t,refresh_token:t.refresh_token||token?.refresh_token,expires:Date.now()+t.expires_in*1000};sessionStorage.setItem(key,JSON.stringify(token));return token.access_token}
async function access(){if(token?.expires>Date.now()+60000)return token.access_token;if(!token?.refresh_token)throw Error("Bitte erneut anmelden.");if(!refreshing)refreshing=exchange({grant_type:"refresh_token",refresh_token:token.refresh_token}).finally(()=>refreshing=null);return refreshing}
q("login").onclick=async()=>{try{const verifier=random(),state=random();sessionStorage.setItem(key+"v",verifier);sessionStorage.setItem(key+"s",state);const challenge=b64(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier))));location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id,redirect_uri,response_type:"code",state,code_challenge_method:"S256",code_challenge:challenge,scope:"streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state"});}catch(e){say(e.message)}};
let playback=null,chosen=0;const tracks=["3U4isOIWM3VvDubwSI3y7a","0tgVpDi06FyKpA1z0VMD4v"];const fmt=ms=>Math.floor(ms/60000)+":"+String(Math.floor(ms/1000)%60).padStart(2,"0");
function controls(){q("connect").disabled=!(sdk&&token)||!!player;q("one").disabled=q("two").disabled=q("pause").disabled=!(device&&activated);for(const id of ["prev","next","toggle","volume"])q(id).disabled=!(device&&activated);q("seek").disabled=!(device&&activated&&playback);q("login").hidden=!!token;}
window.onSpotifyWebPlaybackSDKReady=()=>{sdk=true;controls()};
q("connect").onclick=async()=>{try{player=new Spotify.Player({name:"Sissi & George Musiktest",getOAuthToken:cb=>access().then(cb).catch(e=>say(e.message)),volume:0.6});for(const event of ["initialization_error","authentication_error","account_error","playback_error"])player.addListener(event,({message})=>say(event+": "+message));player.addListener("player_state_changed",state=>{playback=state;if(state){const t=state.track_window.current_track;q("title").textContent=t.name;q("artist").textContent=t.artists.map(a=>a.name).join(", ");const cover=t.album.images[0]?.url;if(cover){q("cover").src=cover;q("cover").hidden=false;}q("toggle").textContent=state.paused?"▶":"Ⅱ";const idx=tracks.indexOf(t.id);if(idx>=0)chosen=idx;}controls();});player.addListener("ready",({device_id})=>{device=device_id;say("Player bereit. Bitte einen Song wählen.");controls()});player.addListener("not_ready",()=>{device=null;controls();say("Player nicht verfügbar.")});await player.activateElement();activated=true;controls();if(!await player.connect())throw Error("Verbindung fehlgeschlagen");}catch(e){player?.disconnect();player=null;activated=false;controls();say(e.message)}};
async function play(id){try{chosen=tracks.indexOf(id);const activation=player.activateElement();await activation;const r=await fetch("https://api.spotify.com/v1/me/player/play?device_id="+encodeURIComponent(device),{method:"PUT",headers:{Authorization:"Bearer "+await access(),"Content-Type":"application/json"},body:JSON.stringify({uris:["spotify:track:"+id]})});if(!r.ok)throw Error("Wiedergabe: HTTP "+r.status);say("Wiedergabe angefordert.");}catch(e){say(e.message)}}
setInterval(async()=>{if(!player||!device)return;try{const state=await player.getCurrentState();if(!state)return;playback=state;q("seek").max=state.duration;q("seek").value=state.position;q("elapsed").textContent=fmt(state.position);q("duration").textContent=fmt(state.duration);}catch(e){}},1000);
q("seek").onchange=()=>player.seek(Number(q("seek").value)).catch(e=>say(e.message));
q("volume").onchange=()=>player.setVolume(Number(q("volume").value)/100).catch(e=>say(e.message));
q("toggle").onclick=()=>playback?player.togglePlay().catch(e=>say(e.message)):play(tracks[chosen]);
q("prev").onclick=()=>play(tracks[(chosen+tracks.length-1)%tracks.length]);q("next").onclick=()=>play(tracks[(chosen+1)%tracks.length]);
q("one").onclick=()=>play("3U4isOIWM3VvDubwSI3y7a");q("two").onclick=()=>play("0tgVpDi06FyKpA1z0VMD4v");q("pause").onclick=()=>player.pause().catch(e=>say(e.message));q("logout").onclick=()=>{player?.disconnect();for(const suffix of ["","v","s"])sessionStorage.removeItem(key+suffix);location.replace(redirect_uri)};
(async()=>{try{token=JSON.parse(sessionStorage.getItem(key)||"null");const p=new URLSearchParams(location.search);if(p.has("code")||p.has("error")){history.replaceState(null,"",redirect_uri);const state=sessionStorage.getItem(key+"s"),verifier=sessionStorage.getItem(key+"v");sessionStorage.removeItem(key+"s");sessionStorage.removeItem(key+"v");if(p.has("error"))throw Error(p.get("error"));if(!state||p.get("state")!==state||!verifier)throw Error("Anmeldung ungültig. Bitte erneut anmelden.");await exchange({grant_type:"authorization_code",code:p.get("code"),redirect_uri,code_verifier:verifier})}if(token){await access();say("Spotify angemeldet. Bitte Player aktivieren.");}controls()}catch(e){say(e.message);token=null;controls()}})();
</script><script src="https://sdk.scdn.co/spotify-player.js" async></script></html>
