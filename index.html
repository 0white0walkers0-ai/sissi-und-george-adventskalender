<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sissi & George – Unser Adventskalender</title>
<style>
:root {
  --red:#a51f39;
  --gold:#f4d18a;
  --cream:#fff7e9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:system-ui,Arial,sans-serif;
  color:var(--cream);
  background:
    radial-gradient(ellipse at top,#345f5a,#112c35 60%,#081b25);
  min-height:100vh;
}
header {
  text-align:center;
  padding:36px 15px 15px;
}
h1 {
  font-family:Georgia,serif;
  font-size:clamp(29px,6vw,52px);
  color:var(--gold);
  margin:0;
}
header p { line-height:1.6; }
.controls {
  text-align:center;
  margin:16px auto 24px;
}
button, a.music {
  cursor:pointer;
  font:inherit;
  border:0;
  border-radius:12px;
  padding:12px 16px;
}
button:focus-visible, a:focus-visible {
  outline:3px solid var(--gold);
  outline-offset:3px;
}
.controls button {
  background:#fff2d5;
  color:#25373a;
}
.calendar {
  max-width:1050px;
  margin:0 auto 50px;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.door {
  min-height:130px;
  color:var(--gold);
  background:linear-gradient(145deg,#ad3046,#65182c);
  border:2px solid #dfb979;
  box-shadow:0 5px 14px #0005;
  position:relative;
  transition:transform .2s;
}
.door:hover { transform:translateY(-3px); }
.door .number {
  font: bold clamp(27px,5vw,45px) Georgia,serif;
}
.door .symbol {
  display:block;
  font-size:26px;
  margin-top:8px;
}
.door.opened {
  background:linear-gradient(145deg,#426d63,#21453f);
}
.door.locked {
  opacity:.55;
}
.overlay {
  position:fixed;
  inset:0;
  z-index:10;
  background:#06151eea;
  display:none;
  overflow:auto;
  padding:20px 12px;
}
.overlay.visible { display:block; }
.panel {
  position:relative;
  max-width:650px;
  margin:20px auto;
  padding:24px;
  text-align:center;
  background:#173b40;
  border:2px solid var(--gold);
  border-radius:22px;
}
.close {
  position:absolute;
  top:10px;
  right:10px;
  background:#fff2d5;
  color:#203b3a;
}
.panel h2 { color:var(--gold); }
.scene {
  min-height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(145deg,#54766d,#253d55);
  border-radius:15px;
  margin:20px 0;
  padding:15px;
  overflow:hidden;
}
.scene img {
  max-width:100%;
  max-height:440px;
  object-fit:contain;
  border-radius:10px;
}
.placeholder { font-size:65px; }
.message {
  font-family:Georgia,serif;
  font-size:21px;
  line-height:1.5;
}
.music-links {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin:20px 0;
}
a.music {
  display:inline-block;
  color:white;
  text-decoration:none;
  font-weight:bold;
}
.spotify { background:#167c42; }
.youtube { background:#c7252e; }
.reveal {
  display:none;
  padding:15px;
  background:#fff1d9;
  color:#25383a;
  border-radius:12px;
  line-height:1.6;
}
.reveal.visible { display:block; }
.navigation {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:20px;
}
.navigation button {
  background:#f1d39a;
  color:#263b3a;
}
footer {
  text-align:center;
  padding:20px;
  color:#e6d7b9;
}
@media(max-width:600px) {
  .calendar { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .door { min-height:105px; }
  .panel { padding:17px; }
}
@media(prefers-reduced-motion:reduce) {
  * { transition:none !important; }
}
.scene { position:relative; perspective:850px; overflow:visible; isolation:isolate; margin:32px 12px 42px; border:2px solid var(--gold); box-shadow:inset 0 0 35px #0009; }
.scene img { position:relative; z-index:1; transform-origin:center center; animation:pop-scene 2.4s cubic-bezier(.2,.7,.2,1) both; box-shadow:0 12px 28px #0007; }
.door-cover { position:absolute; inset:0; z-index:3; pointer-events:none; perspective:850px; transform-style:preserve-3d; }
.curtain { position:absolute; top:0; bottom:0; width:50.2%; background:linear-gradient(180deg,#ffffff22,transparent 30%,#0005),repeating-linear-gradient(90deg,#3b0718 0%,#721027 7%,#b43b51 15%,#d15a68 19%,#85152f 26%,#3b0718 33%); box-shadow:0 8px 20px #0009,inset 0 -5px #dfb979; border-top:4px solid #dfb979; }
.curtain.left { left:0; border-radius:12px 0 0 12px; transform-origin:left center; animation:curtain-left 1.65s cubic-bezier(.4,0,.2,1) forwards; }
.curtain.right { right:0; border-radius:0 12px 12px 0; transform-origin:right center; animation:curtain-right 1.65s cubic-bezier(.4,0,.2,1) forwards; }
.door-face { position:absolute; inset:0; display:grid; place-items:center; color:var(--gold); font:bold 52px Georgia,serif; text-shadow:0 3px 8px #000; animation:curtain-number .65s ease forwards; }
@keyframes curtain-number { 0%,25% { opacity:1; } 100% { opacity:0; } }
@keyframes curtain-left { 0%,12% { transform:translateZ(18px) scaleX(1); } 85% { opacity:1; } 100% { transform:translateX(-12%) translateZ(35px) rotateY(-20deg) scaleX(.10); opacity:0; } }
@keyframes curtain-right { 0%,12% { transform:translateZ(18px) scaleX(1); } 85% { opacity:1; } 100% { transform:translateX(12%) translateZ(35px) rotateY(20deg) scaleX(.10); opacity:0; } }
@keyframes pop-scene { 0%,15% { transform:translateZ(-160px) scale(.78); filter:brightness(.45); } 60% { transform:translateZ(0) scale(.98); filter:brightness(1); } 85% { transform:translateZ(45px) scale(1.12); } 100% { transform:translateZ(25px) scale(1.10); filter:brightness(1); } }
@media(max-width:600px) { .scene { margin:28px 8px 36px; } .scene img { max-width:92%; } }
@media(prefers-reduced-motion:reduce) { .scene .door-cover { display:none; } .scene img { animation:none !important; } }

.scene { background:radial-gradient(ellipse at 50% 0%,#e7c77977,transparent 70%),linear-gradient(145deg,#54766d,#253d55); }
.scene .door-cover { z-index:0; animation:curtain-layer 1.65s step-end forwards; }
@keyframes curtain-layer { from { z-index:3; } to { z-index:0; } }
@keyframes curtain-left { 0%,12% { transform:translateZ(18px) scaleX(1); } 100% { transform:translateX(-5%) rotateY(-12deg) scaleX(.18); opacity:1; } }
@keyframes curtain-right { 0%,12% { transform:translateZ(18px) scaleX(1); } 100% { transform:translateX(5%) rotateY(12deg) scaleX(.18); opacity:1; } }
.scene img { --rx:0deg; --ry:0deg; }
.scene img.pop-ready { animation:none; transform:translateZ(25px) scale(1.10) rotateX(var(--rx)) rotateY(var(--ry)); transition:transform .25s ease; }
.spark { position:absolute; left:50%; top:50%; z-index:4; pointer-events:none; color:#ffdf91; text-shadow:0 0 9px #ffca60; animation:spark-out 2s ease-out both; }
@keyframes spark-out { 0% { transform:translate(0,0) scale(.3); opacity:0; } 20% { opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(.7); opacity:0; } }
.door.opened .symbol { animation:heart-glow 2.8s ease-in-out infinite; }
@keyframes heart-glow { 50% { transform:scale(1.13); filter:drop-shadow(0 0 7px #f4d18a); } }
.snow-layer { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.snow-layer.front { z-index:11; }
.snowflake { position:absolute; top:-25px; color:#fff7e9; animation:snow-fall linear infinite; }
@keyframes snow-fall { to { transform:translate(35px,calc(100vh + 50px)); } }
header,.controls,.calendar,footer { position:relative; }
.panel.finale { box-shadow:0 0 45px #f4d18a66; }
.panel .message { animation:message-in 2.8s ease both; }
@keyframes message-in { 0%,55% { opacity:0; transform:translateY(8px); } 100% { opacity:1; transform:none; } }
@media(prefers-reduced-motion:reduce) { .snow-layer,.spark { display:none; } .door.opened .symbol,.panel .message { animation:none; } .scene img.pop-ready { transform:none; } }

/* Festive proscenium ornaments, outside the image area. */
.scene { margin-top:44px; margin-bottom:52px; }
.scene .door-cover { animation:none; z-index:3; }
@keyframes curtain-left { 0%,12% { transform:translateZ(18px) scaleX(1); opacity:1; } 80% { opacity:1; } 100% { transform:translateX(-12%) rotateY(-20deg) scaleX(.08); opacity:0; } }
@keyframes curtain-right { 0%,12% { transform:translateZ(18px) scaleX(1); opacity:1; } 80% { opacity:1; } 100% { transform:translateX(12%) rotateY(20deg) scaleX(.08); opacity:0; } }
.stage-ornament { position:absolute; left:50%; width:min(94%,420px); height:34px; z-index:5; pointer-events:none; transform:translateX(-50%) translateZ(12px); filter:drop-shadow(0 4px 4px #0008); }
.stage-ornament.top { top:-24px; }
.stage-ornament.bottom { bottom:-25px; height:29px; }
.stage-ornament svg { display:block; width:100%; height:100%; overflow:visible; }
@media(max-width:600px) { .scene { margin-top:38px; margin-bottom:44px; } .stage-ornament { height:27px; } .stage-ornament.top { top:-20px; } .stage-ornament.bottom { bottom:-21px; height:24px; } }
</style>
</head>
<body>

<header>
  <h1>🎄 Sissi & George 🦄</h1>
  <p>Unser Adventskalender ❤️<br>
  24 Türchen · 24 Lieder · ganz viel Liebe</p>
</header>

<div class="controls">
  <button id="modeButton" onclick="toggleMode()">
    🎁 Vorschau: Alle Türchen öffnen
  </button>
</div>

<main id="calendar" class="calendar"></main>

<div id="overlay" class="overlay"
     onclick="if(event.target===this)closeDoor()">
  <section class="panel" role="dialog"
           aria-modal="true" aria-labelledby="doorTitle">
    <button class="close" onclick="closeDoor()"
            aria-label="Schließen">✕</button>

    <h2 id="doorTitle"></h2>

    <div id="scene" class="scene"></div>

    <p id="message" class="message"></p>

    <p>🎶 Ein Lied wartet auf dich …</p>
    <p>Wähle deinen Musikdienst und
       entdecke die Überraschung!</p>

    <div class="music-links">
      <a id="spotify" class="music spotify"
         target="_blank" rel="noopener noreferrer">
        🎵 Spotify
      </a>
      <a id="youtube" class="music youtube"
         target="_blank" rel="noopener noreferrer">
        ▶ YouTube
      </a>
    </div>

    <p id="musicPreference" aria-live="polite"></p>
    <button id="forgetMusic" type="button" hidden>Musikdienst ändern</button>
    <div id="reveal" class="reveal" aria-live="polite"></div>

    <div class="navigation">
      <button onclick="navigate(-1)">← Zurück</button>
      <button onclick="navigate(1)">Weiter →</button>
    </div>
  </section>
</div>

<footer>
  Mit Liebe gemacht ❤️<br>
  Für all die kleinen und großen Glücksmomente.
</footer>

<script>
const playlist = [
  ["ABBA","I Do, I Do, I Do, I Do, I Do"],
  ["John Legend","All of Me"],
  ["Ed Sheeran","Perfect"],
  ["Bruno Mars","Just the Way You Are"],
  ["Elvis Presley","Can't Help Falling in Love"],
  ["Ben E. King","Stand By Me"],
  ["Blümchen","Herz an Herz"],
  ["Bryan Adams","(Everything I Do) I Do It for You"],
  ["The Temptations","My Girl"],
  ["Whitney Houston","I Will Always Love You"],
  ["ABBA","Dancing Queen"],
  ["Phil Collins","You'll Be in My Heart"],
  ["GroßstadtEngel","Gute Laune"],
  ["Queen","Don't Stop Me Now"],
  ["Berlin","Take My Breath Away"],
  ["Helene Fischer & Florian Silbereisen","Schau mal herein"],
  ["Silbermond","Das Beste"],
  ["Adel Tawil","Lieder"],
  ["Elton John","Can You Feel the Love Tonight"],
  ["Bill Medley & Jennifer Warnes","(I've Had) The Time of My Life"],
  ["The Beatles","All You Need Is Love"],
  ["Mark Forster","194 Länder"],
  ["Céline Dion","My Heart Will Go On"],
  ["ENKAY","Du bist toll"]
];

const scenes = [
  ["💍","Ein kleines Ja kann ganz großes Glück bedeuten."],
  ["💚","Du bist wunderbar, mit allem, was dich ausmacht."],
  ["🛷","Manche Augenblicke fühlen sich einfach perfekt an."],
  ["🎄","Du musst nichts verändern, um besonders zu sein."],
  ["🏙️","Manchmal findet das Herz seinen eigenen Weg."],
  ["🦢","Zusammen ist selbst ein kalter Tag voller Wärme."],
  ["🍪","Ein bisschen Chaos und ganz viel Herz."],
  ["🌊","Für dich würde ich sogar dem Winterwind trotzen."],
  ["☃️","Mit dir wird jeder Wintertag ein Sonnentag."],
  ["🎬","Ich bin da, wenn du mich brauchst."],
  ["🎤","Heute gehört die Bühne uns!"],
  ["🌿","Ein Platz in meinem Herzen ist immer für dich frei."],
  ["🎢","Mit dir macht sogar das größte Durcheinander Spaß."],
  ["🚆","Auf zu neuen Abenteuern – bloß nicht den Zug verpassen!"],
  ["✈️","Manche Begegnungen rauben einem den Atem."],
  ["🎭","Ein Blick sagt manchmal mehr als tausend Worte."],
  ["🕯️","Das Schönste an diesem Moment bist du."],
  ["🌍","Jedes Lied erzählt ein kleines Stück unserer Geschichte."],
  ["🦁","Unter dem Sternenhimmel zählt nur dieser Augenblick."],
  ["💃","Ein Moment, den wir niemals vergessen."],
  ["🚌","Manchmal braucht es nur ein bisschen Liebe."],
  ["🎡","194 Länder – aber mein Lieblingsplatz ist bei dir."],
  ["🚢","Manche Gefühle bleiben für immer."],
  ["🎁","Du bist toll. Genau so, wie du bist. ❤️"]
];

let preferredMusic = "";
try { preferredMusic = localStorage.getItem("preferredMusic") || ""; } catch(e) {}
if (!["spotify","youtube"].includes(preferredMusic)) preferredMusic = "";
function updateMusicPreference() {
  $("musicPreference").textContent = preferredMusic ? "Bevorzugter Musikdienst: " + (preferredMusic === "spotify" ? "Spotify" : "YouTube") : "Wähle deinen bevorzugten Musikdienst.";
  $("forgetMusic").hidden = !preferredMusic;
}
function rememberMusic(service) {
  preferredMusic = service;
  try { localStorage.setItem("preferredMusic", service); } catch(e) {}
  updateMusicPreference();
}
let current = 0;
let preview = true;
let opened = new Set();
let revealed = new Set();

const $ = id => document.getElementById(id);

function available(day) {
  if (preview) return true;
  const now = new Date();
  return now.getMonth() === 11 &&
         now.getDate() >= day;
}

function renderCalendar() {
  $("calendar").innerHTML = "";
  scenes.forEach((scene,i) => {
    const day = i+1;
    const btn = document.createElement("button");
    btn.className = "door" +
      (opened.has(i) ? " opened" : "") +
      (!available(day) ? " locked" : "");
    btn.disabled = !available(day);
    btn.setAttribute("aria-label","Türchen "+day);
    btn.innerHTML =
      '<span class="number">'+day+'</span>' +
      '<span class="symbol">'+
      (opened.has(i) ? "❤️" : "✦")+
      '</span>';
    btn.onclick = () => openDoor(i);
    $("calendar").appendChild(btn);
  });
}

function openDoor(i) {
  if (!available(i+1)) return;
  current = i;
  opened.add(i);
  renderCalendar();

  $("doorTitle").textContent = "🎁 Türchen "+(i+1);
  $("message").textContent = scenes[i][1];

  const scene = $("scene");
  scene.innerHTML = "";

  // Die endgültigen AVIF-Bilder sind nach Türchennummer benannt.
  // Bildname: Bilder/01.avif bis Bilder/24.avif
  
 // Türchen 14 und 15 tauschen ihre bisherigen Bilddateien.
 const imageDay = i + 1;
 const filename = "Bilder/" + String(imageDay).padStart(2, "0") + ".avif";

  const img = document.createElement("img");
  img.alt = "Sissi und George – Türchen "+(i+1);
  img.src = filename;

  img.onerror = () => {
    scene.innerHTML =
      '<div class="placeholder">'+scenes[i][0]+'</div>'+
      '<p>Unser Sissi-und-George-Bild folgt ❤️</p>';
  };
  scene.appendChild(img);
  const cover = document.createElement("div");
  cover.className = "door-cover";
  cover.setAttribute("aria-hidden","true");
  const face = document.createElement("span");
  face.className = "door-face";
  face.textContent = (i+1) + " ✦";
  const left = document.createElement("span");
  left.className = "curtain left";
  const right = document.createElement("span");
  right.className = "curtain right";
  cover.append(left, right, face);
  scene.appendChild(cover);
  right.addEventListener("animationend",()=>cover.remove(),{once:true});
  for(const position of ["top","bottom"]){
    const ornament=document.createElement("div");
    ornament.className="stage-ornament "+position;
    ornament.setAttribute("aria-hidden","true");
    const branches=Array.from({length:12},(_,k)=>{
      const x=35+k*30, y=18+Math.abs(k-5.5)*1.1;
      return '<g transform="translate('+x+' '+y+')"><path d="M-25 0 Q0 -8 25 0" stroke="#244e3b" stroke-width="5" fill="none"/><path d="M-18 0 l-12 -10 M-12 -2 l-8 -12 M-4 -3 l-3 -13 M5 -3 l6 -12 M13 -1 l12 -9 M-13 1 l-9 9 M0 0 l-3 12 M12 1 l12 9" stroke="#54856a" stroke-width="3" stroke-linecap="round" fill="none"/></g>';
    }).join("");
    const baubles=[70,130,270,330].map((x,k)=>'<circle cx="'+x+'" cy="'+(23+k%2*4)+'" r="5" fill="#d9ad58" stroke="#ffe2a0"/><circle cx="'+(x-1.5)+'" cy="'+(21+k%2*4)+'" r="1.5" fill="#fff4c5"/>').join("");
    const center=position==="top"?'<path d="M200 18 Q174 -3 170 12 Q170 28 200 18 Q226 -3 230 12 Q230 28 200 18 L214 36 L200 29 L186 36 Z" fill="#a51f39" stroke="#f4d18a" stroke-width="1.3"/><circle cx="200" cy="18" r="5" fill="#c64a55" stroke="#f4d18a"/>':'<path d="M200 7 L203 16 L213 16 L205 22 L208 32 L200 26 L192 32 L195 22 L187 16 L197 16 Z" fill="#f4d18a"/>';
    ornament.innerHTML='<svg viewBox="0 0 400 40" xmlns="http://www.w3.org/2000/svg"><path d="M8 26 Q200 4 392 26" stroke="#dfb979" stroke-width="1.5" fill="none"/>'+branches+baubles+center+'</svg>';
    scene.appendChild(ornament);
  }
  document.querySelector(".panel").classList.toggle("finale", i===23);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced) {
    for(let k=0;k<(i===23?42:18);k++){
      const spark=document.createElement("span");
      spark.className="spark"; spark.setAttribute("aria-hidden","true");
      spark.textContent=k%3===0?"✦":"·";
      const angle=k*2.399, distance=65+(k%9)*12;
      spark.style.setProperty("--dx",Math.cos(angle)*distance+"px");
      spark.style.setProperty("--dy",Math.sin(angle)*distance+"px");
      spark.style.animationDelay=(.45+k*.025)+"s";
      spark.style.fontSize=(9+k%5*3)+"px";
      scene.appendChild(spark);
      spark.addEventListener("animationend",()=>spark.remove(),{once:true});
    }
    img.addEventListener("animationend",()=>img.classList.add("pop-ready"),{once:true});
    img.addEventListener("pointermove",e=>{
      if(e.pointerType!=="mouse" || !img.classList.contains("pop-ready"))return;
      const q=img.getBoundingClientRect();
      img.style.setProperty("--ry",((e.clientX-q.left)/q.width-.5)*12+"deg");
      img.style.setProperty("--rx",(.5-(e.clientY-q.top)/q.height)*12+"deg");
    });
    img.addEventListener("pointerleave",()=>{img.style.setProperty("--rx","0deg");img.style.setProperty("--ry","0deg");});
  }
  const message=$("message");
  message.style.animation="none"; void message.offsetWidth; message.style.animation="";
  
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) cover.remove();

  const query = encodeURIComponent(
    playlist[i][0]+" "+playlist[i][1]
  );

  $("spotify").href =
    "https://open.spotify.com/search/"+query;

  $("youtube").href =
    "https://www.youtube.com/results?search_query="+query;

  $("reveal").classList.toggle(
    "visible",revealed.has(i)
  );

  $("reveal").textContent =
    "🎶 "+playlist[i][0]+" – "+playlist[i][1];

  $("overlay").classList.add("visible");
  document.body.style.overflow = "hidden";
  updateMusicPreference();
  if (preferredMusic) {
    const link = $(preferredMusic);
    link.focus({preventScroll:true});
  }
}

function revealSong() {
  revealed.add(current);
  $("reveal").classList.add("visible");
}

["spotify","youtube"].forEach(service => {
  $(service).addEventListener("click", () => { rememberMusic(service); revealSong(); });
});
$("forgetMusic").addEventListener("click", () => {
  preferredMusic = "";
  try { localStorage.removeItem("preferredMusic"); } catch(e) {}
  updateMusicPreference();
});

function closeDoor() {
  $("overlay").classList.remove("visible");
  document.body.style.overflow = "";
}

function navigate(step) {
  let next = current+step;
  if (next<0 || next>=24) return;
  if (available(next+1)) openDoor(next);
}

function toggleMode() {
  preview = !preview;
  $("modeButton").textContent = preview
    ? "🎁 Vorschau: Alle Türchen öffnen"
    : "🔒 Adventsmodus: täglich freischalten";
  closeDoor();
  renderCalendar();
}

document.addEventListener("keydown",e => {
  if (!$("overlay").classList.contains("visible")) return;
  if (e.key==="Escape") closeDoor();
  if (e.key==="ArrowLeft") navigate(-1);
  if (e.key==="ArrowRight") navigate(1);
});

renderCalendar();
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  for(let layer=0;layer<2;layer++){
    const snow=document.createElement("div"); snow.className="snow-layer"+(layer?" front":""); snow.setAttribute("aria-hidden","true");
    for(let k=0;k<(layer?10:22);k++){
      const f=document.createElement("span"); f.className="snowflake"; f.textContent="❄";
      f.style.left=((k*37+layer*13)%100)+"%";
      f.style.fontSize=(layer?12+k%4*3:6+k%4*2)+"px";
      f.style.opacity=layer?".35":".22";
      f.style.animationDuration=(layer?10+k%5:17+k%7)+"s";
      f.style.animationDelay=-(k*2.7)+"s"; snow.appendChild(f);
    }
    document.body.prepend(snow);
  }
}
</script>
</body>
</html>
